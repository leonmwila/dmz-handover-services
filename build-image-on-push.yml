name: Build image on push

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_NAME="${GITHUB_REPOSITORY##*/}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}" \
            .

      - name: Save image tag artifact
        run: |
          mkdir -p dist
          printf '%s:%s\n' "${{ steps.image.outputs.image }}" "${{ steps.image.outputs.tag }}" > dist/image-tag.txt

      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: dist/image-tag.txt
